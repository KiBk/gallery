<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101b18">
  <meta name="description" content="A collection of small tools, trip plans, games, and experiments on kibk.net.">
  <meta name="robots" content="noindex, nofollow">
  <title>Gallery — kibk.net</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js?v=pages-20261101" defer></script>
</head>
<body>
  <div class="page-shell">
    <header class="site-header">
      <a class="brand" href="/" aria-label="Gallery home">
        <span class="brand-mark" aria-hidden="true">
          <span></span><span></span><span></span><span></span>
        </span>
        <span>kibk.net</span>
      </a>
      <a class="heimdall-link" href="https://kibk.net">
        Home
        <span aria-hidden="true">↗</span>
      </a>
    </header>

    <main>
      <section class="intro" aria-labelledby="page-title">
        <p class="eyebrow">Personal collection</p>
        <h1 id="page-title">Small things,<br><em>kept within reach.</em></h1>
        <p class="lede">Trip plans, workshop tools, games, and experiments—all in one quiet corner.</p>
      </section>

      <section class="catalogue" aria-labelledby="catalogue-title">
        <div class="catalogue-tools">
          <div>
            <h2 id="catalogue-title">The collection</h2>
            <p id="result-count" class="result-count" aria-live="polite">Loading…</p>
          </div>
          <label class="search-box">
            <span class="visually-hidden">Search the gallery</span>
            <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"></circle><path d="m16 16 4 4"></path></svg>
            <input id="search" type="search" placeholder="Find something" autocomplete="off" spellcheck="false">
            <kbd>/</kbd>
          </label>
        </div>

        <nav id="filters" class="filters" aria-label="Filter by collection"></nav>
        <div id="app-grid" class="app-grid" aria-busy="true"></div>
        <div id="empty-state" class="empty-state" hidden>
          <p>Nothing here matches that search.</p>
          <button id="clear-search" type="button">Clear search</button>
        </div>
      </section>
    </main>

    <footer>
      <p>Personal tools and places, hosted on GitHub Pages.</p>
      <a href="#page-title">Back to top ↑</a>
    </footer>
  </div>
</body>
</html>
